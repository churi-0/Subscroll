<body class="account-locked">

<div class="account-gate" id="accountGate" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
  <div class="account-card">
    <div class="account-mark" aria-hidden="true"><i></i></div>
    <h1 id="accountTitle">SubScroll</h1>
    <p id="accountCopy">Opening your space…</p>
    <form id="loginForm" hidden>
      <label for="accountPassword">Account password</label>
      <div class="account-field">
        <input id="accountPassword" type="password" minlength="4" maxlength="256"
          autocomplete="current-password" required autofocus placeholder="Enter your password">
        <button id="loginSubmit" type="submit">Continue</button>
      </div>
      <small>First use creates a new space. There is no password recovery, and a typo opens a different space. Use a strong password manager-generated password.</small>
    </form>
    <div class="account-status" id="accountStatus" role="status"></div>
    <button class="account-retry" id="accountRetry" type="button" hidden>Try again</button>
  </div>
</div>

<button class="tray-ch trayup" id="clearX" type="button" aria-label="Show post info">▴</button>

<header id="hdr">
  <div class="bar">
    <button class="feedpill" id="feedPill" aria-label="Switch feed">
      <span class="fico" id="feedIco">★</span>
      <span class="fwrap">
        <span class="fname" id="feedName">Favourites</span>
        <span class="fmeta" id="feedMeta">—</span>
      </span>
      <span class="fchev">▼</span>
    </button>
    <button class="ic" id="btnSearch" aria-label="Search subreddits">⌕</button>
    <button class="ic" id="btnMore" aria-label="Settings">⋯</button>
  </div>
  <div class="sorts" id="sorts"></div>
</header>

<div class="count" id="count"></div>
<main id="feed"></main>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="shandle" id="sheetHandle"><i></i></div>
  <div class="shead">
    <button class="back" id="sheetBack" hidden aria-label="Back">‹</button>
    <h2 id="sheetTitle">Feeds</h2>
    <button class="sbtn" id="sheetAction" hidden></button>
  </div>
  <div class="sbody" id="sheetBody"></div>
  <div class="sfoot" id="sheetFoot" hidden></div>
</section>

<div class="toast" id="toast"></div>
