<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<meta name="bingbot" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<meta name="Slurp" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<meta name="AhrefsBot" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<meta name="SemrushBot" content="noindex, nofollow, noimageindex, noarchive, noodp, notranslate, nosnippet">
<title>SubScroll</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SubScroll">
<meta name="application-name" content="SubScroll">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%230e1114'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23ff5a2d' stroke-width='6'/%3E%3Cpath d='M90 68v44M68 90h44' stroke='%23f3f6fa' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230e1114'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ff5a2d' stroke-width='2.5'/%3E%3Cpath d='M32 24v16M24 32h16' stroke='%23f3f6fa' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22SubScroll%22%2C%22short_name%22%3A%22SubScroll%22%2C%22display%22%3A%22standalone%22%2C%22scope%22%3A%22%2F%22%2C%22start_url%22%3A%22%2Findex.html%22%2C%22theme_color%22%3A%22%23000000%22%2C%22background_color%22%3A%22%23000000%22%7D">
<link rel="stylesheet" href="style.css">
</head>
<body class="account-locked">

<!-- ═══════════════ ACCOUNT GATE ═══════════════ -->
<div class="account-gate" id="accountGate" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
  <div class="account-card">
    <div class="account-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="30" height="30" fill="none" stroke="#ff5a2d" stroke-width="4" stroke-linecap="round">
        <circle cx="32" cy="32" r="21"/>
        <path d="M32 24v16M24 32h16" stroke="#f3f6fa"/>
      </svg>
    </div>
    <h1 id="accountTitle">SubScroll</h1>
    <p class="account-copy" id="accountCopy">Opening your space…</p>
    <form id="loginForm" hidden>
      <label for="accountPassword">Account password</label>
      <div class="account-field">
        <input id="accountPassword" type="password" minlength="4" maxlength="256"
          autocomplete="current-password" required autofocus placeholder="Enter your password">
        <button id="loginSubmit" type="submit">Continue</button>
      </div>
      <p class="account-note">First use creates a new space. There is no password recovery, and a typo opens a different space. Use a strong, password-manager-generated password.</p>
    </form>
    <div class="account-status" id="accountStatus" role="status"></div>
    <button class="account-retry" id="accountRetry" type="button" hidden>Try again</button>
  </div>
</div>

<!-- immersive tray toggle (only visible in clear mode) -->
<button class="tray-ch trayup" id="clearX" type="button" aria-label="Show post info">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
</button>

<!-- ═══════════════ HEADER CHROME ═══════════════ -->
<header id="hdr">
  <div class="bar">
    <button class="feedpill" id="feedPill" aria-label="Switch feed">
      <span class="fico" id="feedIco" aria-hidden="true">★</span>
      <span class="fwrap">
        <span class="fname" id="feedName">Favourites</span>
        <span class="fmeta" id="feedMeta">—</span>
      </span>
      <svg class="fchev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="ibtn" id="btnSearch" aria-label="Search subreddits">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="ibtn" id="btnMore" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
  </div>
  <div class="sorts" id="sorts"></div>
</header>

<div class="count" id="count"></div>
<main id="feed"></main>

<div class="scrim" id="scrim"></div>

<!-- ═══════════════ BOTTOM SHEET ═══════════════ -->
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="shandle" id="sheetHandle"><i></i></div>
  <div class="shead">
    <button class="ibtn sm" id="sheetBack" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <h2 id="sheetTitle">Feeds</h2>
    <button class="sbtn" id="sheetAction" hidden></button>
  </div>
  <div class="sbody" id="sheetBody"></div>
  <div class="sfoot" id="sheetFoot" hidden></div>
</section>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
<script src="js/state.js"></script>
<script src="js/view.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
